name: Build NRO

# Compila el .nro de la rama (RE Outbreak / RE Outbreak File 2).
# Los APK de NetherSX2 se descargan del release "inputs" de ESTE mismo repo,
# (repo plantilla publico; cada usuario usa el de ascencionhino-web). El SDK de Mesa sale del ultimo release de tu fork
# publico de danfromtico/mesa-switch. No hace falta ningun token.
on:
  push:
    branches: ['game/**', outbreak, outbreak-file2]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    permissions:
      contents: read
    env:
      INPUTS_REPO: ascencionhino-web/nxmasters-outbreak
      INPUTS_TAG: inputs
      MESA_REPO: ascencionhino-web/mesa-switch
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Dependencias
        run: |
          apt-get update
          apt-get install -y build-essential cmake ninja-build pkg-config bison flex python3 python3-mako python3-yaml git curl ca-certificates gh
          PKGS="switch-tools libnx switch-sdl2 switch-sdl2_ttf switch-sdl2_image switch-curl switch-mesa switch-libdrm_nouveau switch-ntfs-3g switch-libpng switch-libjpeg-turbo deko3d"
          ok=0
          for i in 1 2 3 4 5; do
            if dkp-pacman -S --noconfirm --needed $PKGS; then ok=1; break; fi
            echo "Reintento $i: pkg.devkitpro.org fallo, esperando..."
            sleep 30
            dkp-pacman -Sy --noconfirm || true
          done
          test "$ok" = 1

      - name: Descargar APK (release inputs de este repo privado)
        run: |
          mkdir -p "$RUNNER_TEMP/inputs"
          gh release download "$INPUTS_TAG" --repo "$INPUTS_REPO" \
            --dir "$RUNNER_TEMP/inputs" \
            --pattern '*4248*.apk' --pattern '*3668*.apk'

      - name: Descargar SDK de Mesa (ultimo release de tu fork de mesa-switch)
        run: |
          gh release download --repo "$MESA_REPO" \
            --dir "$RUNNER_TEMP/inputs" \
            --pattern '*switch-unified-horizon-sdk.zip'
          ls -la "$RUNNER_TEMP/inputs"

      - name: libelf vacia (el Makefile la pide, Mesa para Switch no la usa)
        run: |
          lib=/opt/devkitpro/portlibs/switch/lib
          if [ ! -f "$lib/libelf.a" ]; then
            tmp="$(mktemp -d)"
            echo 'void __nx_stub_libelf(void) {}' > "$tmp/stub_elf.c"
            /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc -c "$tmp/stub_elf.c" -o "$tmp/stub_elf.o"
            /opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar rcs "$lib/libelf.a" "$tmp/stub_elf.o"
            echo "libelf.a vacia creada en $lib"
          fi

      - name: Compilar
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export APK_4248="$(ls "$RUNNER_TEMP"/inputs/*4248*.apk | head -1)"
          export APK_3668="$(ls "$RUNNER_TEMP"/inputs/*3668*.apk | head -1)"
          export MESA_SDK_ZIP="$(ls "$RUNNER_TEMP"/inputs/*switch-unified-horizon-sdk.zip | head -1)"
          JOBS=4 bash ./build_all.sh

      - name: Nombre del artefacto
        id: slug
        run: echo "v=$(echo "$GITHUB_REF_NAME" | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - name: Subir .nro
        uses: actions/upload-artifact@v4
        with:
          name: nro-${{ steps.slug.outputs.v }}
          path: NetherSX2.nro
